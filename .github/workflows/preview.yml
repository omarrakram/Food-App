name: Web preview

# Publishes the current build to GitHub Pages so it can be opened and tested on
# a phone — no install, no credentials, no sign-in.
#
# The app is usable entirely on local data, so this preview needs no secrets and
# none are provided to it: Supabase and Anthropic are deliberately absent, the
# app falls back to its bundled catalogue, and the bundle is checked for
# secret-shaped strings before it is published.
#
# Deep links and refresh work because the export is configured for the subpath
# it is actually served from (EXPO_WEB_BASE_URL), and Expo's static output
# writes one HTML file per route. Nothing rewrites the URL at runtime.

on:
  push:
    branches: [claude/expo-rn-setup-mom5gw]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deployment; let the running one land first.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        # ONE-TIME SETUP, and the only thing this needs a human for:
        #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
        #
        # `enablement: true` was tried and cannot work here: creating a Pages
        # site is not something the workflow's GITHUB_TOKEN is allowed to do
        # ("Resource not accessible by integration"), and granting a PAT that
        # could would be a much larger credential than this deserves.

      - name: Explain a missing Pages site rather than failing cryptically
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages is not enabled for this repository."
          echo "::error::Enable it once: Settings -> Pages -> Source: GitHub Actions, then re-run."
          exit 1

      - name: Build the web bundle
        run: npx expo export --platform web
        env:
          # The repository name is the subpath a project site is served from.
          EXPO_WEB_BASE_URL: ${{ steps.pages.outputs.base_path }}
          # DEMO MODE. This preview has no Supabase project behind it, so the
          # social screens — Friends, Messages, sharing, submissions,
          # moderation — would otherwise be permanently empty and nobody could
          # review them. The seeded repositories make them walkable, and every
          # screen they feed renders a DEMO banner saying nothing leaves the
          # device. `EXPO_PUBLIC_APP_ENV` is `preview`, and `env.ts` forces the
          # flag off when it is `production`, so this cannot ship by accident.
          EXPO_PUBLIC_APP_ENV: preview
          EXPO_PUBLIC_DEMO_MODE: 'true'
          # So an external share produces a link a browser can open rather than
          # an `akla://` URL that means nothing outside the app.
          EXPO_PUBLIC_WEB_ORIGIN: ${{ steps.pages.outputs.base_url }}

      - name: Stamp the build so the deployed commit can be checked without opening it
        # `https://<pages>/build.txt` answers "is the preview current?" in one
        # fetch. The About screen carries the same SHA, but reading it means
        # loading the app — and the app shell is exactly the thing a browser
        # might be serving from cache when that question comes up.
        run: |
          set -euo pipefail
          {
            echo "commit=${GITHUB_SHA}"
            echo "short=${GITHUB_SHA:0:7}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "ref=${GITHUB_REF_NAME}"
          } > dist/build.txt
          cat dist/build.txt

      - name: Add an SPA fallback
        # Expo's static output already writes one HTML file per route, so deep
        # links resolve directly. This only catches paths with no file of their
        # own — a stale bookmark, say — and hands them to the app rather than
        # to GitHub's 404 page.
        run: cp dist/index.html dist/404.html

      - name: Refuse to publish anything secret
        # This bundle becomes a public URL. A leaked key would be public with
        # it, so the check is a gate rather than a report.
        #
        # The literal patterns catch a key pasted into a source file. The
        # regex ones catch the shapes — a JWT, a PEM block, an AWS key id —
        # which is what catches the key nobody thought to name. The Supabase
        # key that bypasses RLS entirely is `sb_secret_…` on the modern key
        # system and a `service_role` JWT on the older one; both are matched,
        # and both belong in edge function secrets, nowhere a browser can
        # read.
        run: |
          set -euo pipefail
          bundle=$(find dist -name '*.js' -type f)

          for pattern in 'sk-ant-' 'service_role' 'SUPABASE_SERVICE' 'ANTHROPIC_API_KEY'; do
            if grep -rqF "$pattern" $bundle; then
              echo "::error::Refusing to publish: found '$pattern' in the web bundle."
              exit 1
            fi
          done

          # A Supabase service-role JWT decodes to a payload containing
          # "role":"service_role". The anon key is a JWT too and is SUPPOSED
          # to be in the bundle, so the shape alone cannot be the test — the
          # payload is decoded and inspected.
          for token in $(grep -rhoE 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}' $bundle | sort -u); do
            payload=$(echo "$token" | cut -d. -f2)
            # base64url, and padding is optional in a JWT.
            decoded=$(echo "${payload}==" | tr '_-' '/+' | base64 -d 2>/dev/null || true)
            if echo "$decoded" | grep -q 'service_role'; then
              echo "::error::Refusing to publish: a service-role JWT is in the web bundle."
              exit 1
            fi
          done

          # `sb_secret_…` is the modern Supabase secret key, and it is the one
          # this gate could not previously see: an opaque string rather than a
          # JWT, so the payload decode above never applies to it, and it carries
          # none of the legacy literals.
          #
          # Matched as a SHAPE and not as a bare prefix. A literal `sb_secret_`
          # also matches documentation that names the prefix in order to warn
          # about it — which is exactly what happened, and it failed the deploy
          # over a comment. A real key carries a long random tail; prose does
          # not.
          for shape in 'sb_secret_[A-Za-z0-9_-]{12,}' 'BEGIN [A-Z ]*PRIVATE KEY' 'AKIA[0-9A-Z]{16}' 'ghp_[A-Za-z0-9]{36}'; do
            if grep -rqE "$shape" $bundle; then
              echo "::error::Refusing to publish: found something matching /$shape/ in the bundle."
              exit 1
            fi
          done

          echo "No secret-shaped strings in the bundle."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
