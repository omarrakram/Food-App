name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, test, bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck (app and build scripts)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Edge functions — type check and test
        # The functions run on Deno, not in the app bundle, so nothing else in
        # this job would catch a type error or a broken template literal there.
        run: |
          npm run fn:check
          npm run fn:test

      - name: Every edge-function import resolves the way the deploy resolves it
        # A hosted deploy failed on `Relative import path "zod" not prefixed
        # with / or ./ or ../` while this repository was green: the mapping
        # lived in the shared `supabase/functions/deno.json`, which the local
        # deno CLI finds by walking up and the hosted bundler never reads.
        run: npm run fn:imports

      - name: Check database.types.ts against the migrations
        # Hand-maintained types are the one place the app can be wrong in a way
        # TypeScript cannot see: a renamed column type-checks and fails at
        # runtime. This reads the migrations directly, so it needs no database
        # and no Docker.
        run: npm run db:types:check

      - name: Verify the generated ingredient catalogue matches its CSV
        run: npm run ingredients:import -- --check

      - name: Verify imported price data matches the survey CSV
        run: npm run prices:import -- --check

      - name: Validate the recipe dataset and its generated catalogue
        # Also the dataset's own integrity gate: unknown ingredient slugs,
        # undeclared allergens, contradictory diet tags and near-duplicate
        # titles all fail here rather than reaching a user.
        run: npm run recipes:import -- --check

      - name: Validate the recipe image manifest
        run: npm run images:check

      - name: Refuse offset pagination on anything that grows at the head
        # A thread grows while somebody scrolls back through it, so `range()`
        # shifts the window under the reader and a message goes missing with
        # nothing to draw attention to the gap. Static, because that failure
        # needs a row to arrive between two fetches — rare in a test, constant
        # in production.
        run: npm run audit:pagination

      - name: Verify the generated seed is in step with its TypeScript source
        run: |
          npm run seed:generate
          git diff --exit-code supabase/seed.sql \
            || (echo "::error::supabase/seed.sql is stale. Run 'npm run seed:generate' and commit." && exit 1)

      - name: Production bundle
        run: npx expo export --platform web
        env:
          # Deliberately unset Supabase credentials: the bundle must build, and
          # the app must run, without a backend configured.
          EXPO_PUBLIC_APP_ENV: preview

  smoke:
    name: Drive the built app in a browser
    runs-on: ubuntu-latest
    # It exports the bundle and then walks ~140 interactions across every
    # screen, twice over for the narrow-viewport pass. Twenty-odd minutes is
    # normal; the cap is here so a hung browser fails in half an hour rather
    # than burning the default six.
    timeout-minutes: 35
    # The only job that exercises the app as a user meets it: real navigation,
    # real typing, real rendering. Everything above it can pass while a screen
    # is blank — that is exactly what happened when every ingredient selection
    # returned the same recipes and the unit tests all agreed it was fine.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright and Chromium
        # `playwright install` downloads the BROWSER; it does not install the
        # npm package that drives it. The smoke script deliberately does not
        # depend on Playwright — it locates one at runtime, so the app's
        # dependency tree stays free of a browser automation library — which
        # means CI has to supply it.
        #
        # `playwright` rather than `playwright-core`: it pins the browser
        # revision it was built against, and `playwright install` then
        # resolves to that local copy. Pinning them separately is how you get
        # "Executable doesn't exist" from two compatible-looking versions.
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Walk the app
        # The script exports the bundle itself, with the same DEMO flags the
        # preview deploys under — a smoke test that exercises a different
        # configuration from the deployed one is testing a build nobody opens.
        run: npm run smoke:web

      - name: Keep the screenshots when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: .smoke/
          retention-days: 7

  database:
    name: Migrations, seed and RLS policies
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply migrations, seed, and run the RLS suite
        run: ./scripts/db-test.sh
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres


