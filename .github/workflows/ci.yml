name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, test, bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck (app and build scripts)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Edge functions — type check and test
        # The functions run on Deno, not in the app bundle, so nothing else in
        # this job would catch a type error or a broken template literal there.
        run: |
          npm run fn:check
          npm run fn:test

      - name: Verify the generated ingredient catalogue matches its CSV
        run: npm run ingredients:import -- --check

      - name: Verify imported price data matches the survey CSV
        run: npm run prices:import -- --check

      - name: Verify the generated seed is in step with its TypeScript source
        run: |
          npm run seed:generate
          git diff --exit-code supabase/seed.sql \
            || (echo "::error::supabase/seed.sql is stale. Run 'npm run seed:generate' and commit." && exit 1)

      - name: Production bundle
        run: npx expo export --platform web
        env:
          # Deliberately unset Supabase credentials: the bundle must build, and
          # the app must run, without a backend configured.
          EXPO_PUBLIC_APP_ENV: preview

  database:
    name: Migrations, seed and RLS policies
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply migrations, seed, and run the RLS suite
        run: ./scripts/db-test.sh
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check src/lib/supabase/database.types.ts against the real schema
        # The types were hand-written, which makes them the one place the app
        # can be wrong in a way TypeScript cannot see: a renamed column type-
        # checks perfectly and fails at runtime. The generator needs Docker,
        # which CI has and the dev sandbox does not, so this is where drift is
        # caught.
        run: |
          set -euo pipefail
          npx --yes supabase@2 gen types typescript \
            --db-url "postgresql://postgres:postgres@localhost:5432/akla_test" \
            > /tmp/database.types.generated.ts

          if ! diff -u src/lib/supabase/database.types.ts /tmp/database.types.generated.ts; then
            echo "::error::database.types.ts no longer matches the migrations."
            echo "::error::Regenerate with 'npm run db:types:from-url' and commit the result."
            exit 1
          fi
          echo "Database types match the schema."

